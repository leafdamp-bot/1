name: Publish Glimmer Journey
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout game
        uses: actions/checkout@v6
      - name: Complete and verify HD assets
        shell: python
        run: |
          import concurrent.futures, hashlib, json, pathlib, time, urllib.request
          origin = "https://little-snack-trail-m7q4.tettethteth.chatgpt.site/"
          assets = json.loads(pathlib.Path(".github/game-assets.json").read_text())
          def digest(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          def restore(asset):
              target = pathlib.Path(asset["path"])
              if target.exists() and digest(target.read_bytes()) == asset["sha"]:
                  return
              url = origin + asset["path"].removeprefix("dist/")
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": "GlimmerJourney-Publisher/1.0"})
                      with urllib.request.urlopen(request, timeout=45) as response:
                          data = response.read()
                      if len(data) != asset["size"] or digest(data) != asset["sha"]:
                          raise RuntimeError("Asset checksum mismatch: " + asset["path"])
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
                      print("Verified " + asset["path"], flush=True)
                      return
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(restore, assets))
          print("All " + str(len(assets)) + " HD assets verified.")
      - name: Save complete game to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "Complete verified HD game assets"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
